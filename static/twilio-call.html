<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilio Voice Call Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .call-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .call-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .call-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(45deg, #2193b0, #6dd5ed);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            box-shadow: 0 10px 30px rgba(33, 147, 176, 0.4);
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .call-status {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #333;
            font-weight: 500;
        }
        
        .call-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin: 1.5rem 0;
        }
        
        .call-info p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: #666;
        }
        
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .call-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 1.8rem;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .call-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .call-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-call {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        
        .btn-hangup {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }
        
        .btn-mute {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: white;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
        }
        
        .status-idle {
            background: #e9ecef;
            color: #6c757d;
        }
        
        .status-connecting {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-connected {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .logs-container {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            text-align: left;
        }
        
        .log-entry {
            margin: 0.25rem 0;
            padding: 0.25rem;
        }
        
        .log-info {
            color: #4ec9b0;
        }
        
        .log-error {
            color: #f48771;
        }
        
        .log-success {
            color: #b5cea8;
        }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="call-card">
            <div class="call-avatar" id="call-avatar">
                <i class="bi bi-telephone-fill"></i>
            </div>
            
            <h3>Twilio Voice Call Test</h3>
            <p class="text-muted">Test panggilan ke Twilio menggunakan browser</p>
            
            <div class="call-status">
                <span id="status-text">Siap untuk test call</span>
            </div>
            
            <span class="status-badge status-idle" id="status-badge">Idle</span>
            
            <div class="call-info">
                <p><strong>Status Device:</strong> <span id="device-status">Belum terkoneksi</span></p>
                <p><strong>Call Status:</strong> <span id="call-status">Tidak ada panggilan</span></p>
            </div>
            
            <div class="call-controls">
                <button class="call-btn btn-call" id="call-btn" title="Mulai Panggilan">
                    <i class="bi bi-telephone-fill"></i>
                </button>
                <button class="call-btn btn-mute" id="mute-btn" title="Mute/Unmute" style="display: none;">
                    <i class="bi bi-mic-fill"></i>
                </button>
                <button class="call-btn btn-hangup" id="hangup-btn" title="Akhiri Panggilan" style="display: none;">
                    <i class="bi bi-telephone-x-fill"></i>
                </button>
            </div>
            
            <div class="logs-container" id="logs-container">
                <div class="log-entry log-info">Menunggu inisialisasi...</div>
            </div>
            
            <div class="mt-3">
                <a href="/" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Kembali ke Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.13.0/dist/twilio.min.js"></script>
    <script src="/static/twilio-call.js"></script>
</body>
</html>
