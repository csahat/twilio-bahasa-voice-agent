<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Call - Direct Call</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .call-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .call-header {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border-radius: 20px 20px 0 0;
            padding: 2rem;
            text-align: center;
        }
        
        .call-status {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .call-timer {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .ai-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .call-controls {
            padding: 2rem;
            text-align: center;
        }
        
        .call-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 2rem;
            margin: 0 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .call-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .call-button:active {
            transform: translateY(0);
        }
        
        .start-call {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        
        .end-call {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }
        
        .mute-button {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: white;
        }
        
        .recording {
            animation: recordingPulse 1.5s infinite;
        }
        
        @keyframes recordingPulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        
        .speaking {
            animation: speakingPulse 1s infinite;
        }
        
        @keyframes speakingPulse {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }
        
        .transcript-container {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid #dee2e6;
        }
        
        .transcript-item {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 8px;
        }
        
        .user-transcript {
            background: #007bff;
            color: white;
            margin-left: 20%;
        }
        
        .ai-transcript {
            background: #e9ecef;
            color: #212529;
            margin-right: 20%;
        }
        
        .back-button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-connected {
            background-color: #28a745;
            animation: blink 1s infinite;
        }
        
        .status-connecting {
            background-color: #ffc107;
            animation: blink 0.5s infinite;
        }
        
        .status-disconnected {
            background-color: #dc3545;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100 p-4">
        <div class="row w-100">
            <div class="col-12">
                <div class="call-container mx-auto" style="max-width: 500px;">
                    <!-- Back Button -->
                    <a href="/" class="btn btn-outline-secondary back-button">
                        <i class="bi bi-arrow-left"></i> Kembali
                    </a>
                    
                    <!-- Call Header -->
                    <div class="call-header">
                        <div class="ai-avatar">
                            <i class="bi bi-robot"></i>
                        </div>
                        <div class="call-status" id="call-status">Siap untuk Panggilan</div>
                        <div class="call-timer" id="call-timer" style="display: none;">
                            <span class="status-indicator status-disconnected" id="status-indicator"></span>
                            <span id="timer-text">00:00</span>
                        </div>
                    </div>
                    
                    <!-- Call Controls -->
                    <div class="call-controls">
                        <div class="mb-3">
                            <button id="start-call-btn" class="btn call-button start-call">
                                <i class="bi bi-telephone-fill"></i>
                            </button>
                            <button id="end-call-btn" class="btn call-button end-call" style="display: none;">
                                <i class="bi bi-telephone-x-fill"></i>
                            </button>
                            <button id="mute-btn" class="btn call-button mute-button" style="display: none;">
                                <i class="bi bi-mic-fill"></i>
                            </button>
                        </div>
                        
                        <div class="transcript-container" id="transcript-container" style="display: none;">
                            <h6 class="mb-2"><i class="bi bi-chat-dots"></i> Transkrip Percakapan</h6>
                            <div id="transcript-content"></div>
                        </div>
                        
                        <div class="mt-3">
                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i>
                                Klik tombol telepon untuk memulai panggilan langsung dengan AI
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/voice-call.js"></script>
</body>
</html>
