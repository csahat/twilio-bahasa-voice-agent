<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Call RAG Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .call-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .call-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .call-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .call-status {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #666;
        }
        
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .call-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .call-btn:hover {
            transform: scale(1.1);
        }
        
        .btn-answer {
            background: #28a745;
            color: white;
        }
        
        .btn-end {
            background: #dc3545;
            color: white;
        }
        
        .btn-mute {
            background: #ffc107;
            color: white;
        }
        
        .conversation-log {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
        }
        
        .message {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 8px;
        }
        
        .user-message {
            background: #e3f2fd;
            margin-left: 20%;
        }
        
        .bot-message {
            background: #f3e5f5;
            margin-right: 20%;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-connecting { background: #ffc107; }
        .status-connected { background: #28a745; }
        .status-disconnected { background: #dc3545; }
        
        .volume-indicator {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin: 1rem 0;
            overflow: hidden;
        }
        
        .volume-bar {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #ffc107, #dc3545);
            width: 0%;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="call-card">
            <div class="call-avatar">
                <i class="bi bi-robot"></i>
            </div>
            
            <h3>AI Voice Assistant</h3>
            <div class="call-status">
                <span class="status-indicator" id="status-indicator"></span>
                <span id="status-text">Menunggu koneksi...</span>
            </div>
            
            <div id="interruption-indicator" class="alert alert-warning" style="display: none; margin: 1rem 0;">
                <i class="bi bi-exclamation-triangle"></i>
                <strong>Interruption Detected!</strong> AI speech stopped. You can speak now.
            </div>
            
            <div class="volume-indicator">
                <div class="volume-bar" id="volume-bar"></div>
            </div>
            
            <div class="conversation-log" id="conversation-log">
                <div class="message bot-message">
                    <small>AI: Halo! Saya siap membantu Anda. Silakan mulai berbicara.</small>
                </div>
            </div>
            
            <div class="call-controls">
                <button class="call-btn btn-answer" id="start-call-btn" title="Mulai Panggilan">
                    <i class="bi bi-telephone-fill"></i>
                </button>
                <button class="call-btn btn-mute" id="mute-btn" title="Mute/Unmute" style="display: none;">
                    <i class="bi bi-mic-fill"></i>
                </button>
                <button class="call-btn btn-end" id="end-call-btn" title="Akhiri Panggilan" style="display: none;">
                    <i class="bi bi-telephone-x-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/call.js"></script>
</body>
</html>
